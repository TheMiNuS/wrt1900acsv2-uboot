name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            bc bison flex libssl-dev libgnutls28-dev pkg-config \
            device-tree-compiler python3 python3-setuptools \
            python3-pyelftools swig u-boot-tools
      - name: Validate repository
        run: make validate
      - name: Build all profiles
        run: make build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrt1900acsv2-uboot-v7.0.0
          path: wrt1900acsv2-uboot-full/out/
          if-no-files-found: error
